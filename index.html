
<!DOCTYPE html>
<html lang="en" data-ws-path="/ws">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta name="description" content="EasyRPG Multiplayer">

	<title>EasyRPG Multiplayer</title>

	<link rel="stylesheet" href="/styles/variables.css">
	<link rel="stylesheet" href="/styles/base.css">
	<link rel="stylesheet" href="/styles/picker.css">
	<script type="module" src="/src/picker.js"></script>
</head>
<body>

	<header class="header">
		<a href="/" class="header-logo">EasyRPG Multiplayer</a>
		<button class="btn" id="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to light theme">
			<span class="theme-icon theme-icon--light" aria-hidden="true">☀</span>
			<span class="theme-icon theme-icon--dark" aria-hidden="true">☾</span>
		</button>
	</header>

	<nav id="side-menu" aria-label="Main navigation">
		<a href="/">Games</a>
	</nav>

	<main class="picker-main" id="picker-main">
		<h2 class="picker-title">Choose a game</h2>

		<div class="picker-summary" id="picker-summary">
			<div class="picker-summary-item">
				<span class="picker-summary-label">Total players:</span>
				<span class="picker-summary-value" id="total-players">—</span>
			</div>
		</div>

		<div class="picker-list" id="picker-list" role="list">
			<!-- Game cards are injected here by gamepicker.js -->
		</div>

		<p id="picker-error" class="picker-error" role="alert" aria-live="assertive"></p>
	</main>

	<footer class="footer">
		<span>EasyRPG Multiplayer</span>
		<span>Powered by EasyRPG</span>
	</footer>

</body>
</html>
