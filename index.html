<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<meta name="description" content="EasyRPG Multiplayer Game Picker">

	<title>EasyRPG Multiplayer</title>

	<link rel="stylesheet" href="/styles/systemvariables.css">
	<link rel="stylesheet" href="/styles/style.css">
	<link rel="stylesheet" href="/styles/gamepicker.css">
	<script src="/src/settings.js" defer></script>
	<script src="/src/gamepicker.js" defer></script>
</head>
<body>

	<header class="header">
		<h1>EasyRPG Multiplayer</h1>
	</header>

	<main class="picker-main">
		<h2 class="picker-title">Choose a game</h2>

		<div class="picker-summary" id="picker-summary">
			<div class="picker-summary-item">
				<span class="picker-summary-label">Total players:</span>
				<span class="picker-summary-value" id="total-players">—</span>
			</div>
		</div>

		<div class="picker-list" id="picker-list" role="list">
			<!-- Game cards are injected here by gamepicker.js -->
		</div>

		<p id="picker-error" class="picker-error" role="alert" aria-live="assertive"></p>
	</main>

	<footer class="footer">
		<span>EasyRPG Multiplayer</span>
		<span>Powered by EasyRPG</span>
	</footer>

</body>
</html>
